html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{

html{scroll-behavior:smooth}

.ticker-wrap{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--pk6);overflow:hidden;height:28px}
.ticker{display:flex;align-items:center;height:100%;width:max-content;animation:tScroll 220s linear infinite}
.ti{white-space:nowrap;padding:0 26px;font-size:.72rem;color:rgba(255,255,255,0.88);display:flex;align-items:center;gap:8px}
.tdot{width:5px;height:5px;border-radius:50%;background:#d9a8ed;animation:dPulse 1.8s infinite;flex-shrink:0}
.twin{color:#f0d9f7;font-weight:700}.tprize{color:#ffe899;font-weight:700}
@keyframes tScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes dPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.7)}}

.logo span{color:var(--pk5)}
.nav-links{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;max-width:calc(100vw - 110px)}

.gr{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.type-pin{background:#fdf5ff;color:#7b2d8b;border:1px solid #d9a8ed}

footer{text-align:center;padding:26px 20px;color:var(--muted);font-size:.74rem;border-top:1px solid var(--border)}

#springCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6}
@media(max-width:480px){nav{padding:9px 12px;top:28px}.page{padding:36px 12px 56px}.page-head h1{font-size:1.3rem}.stats-row{gap:10px}.stat-num{font-size:1.25rem}.stat-item{padding:11px 14px}.rev-card{padding:15px 13px;border-radius:16px}.wm-sticker{font-size:.55rem;padding:6px 44px;right:-42px}}

(function(){const C=document.getElementById('springCanvas');if(!C)return;const ctx=C.getContext('2d');let W,H;function resize(){W=C.width=window.innerWidth;H=C.height=window.innerHeight;}resize();window.addEventListener('resize',resize);const PC=['#d9a8ed','#f0d9f7','#fdf5ff','#ffcce0','#ffa0c8','#ffe4ef','#ff8abf'];const BC=['rgba(255,179,209,0.18)','rgba(255,214,232,0.22)','rgba(255,240,245,0.20)','rgba(156,39,176,0.10)'];const petals=Array.from({length:28},()=>makePetal());function makePetal(t){return{x:Math.random()*1800,y:t?-20:-Math.random()*800,r:3+Math.random()*5,sy:.4+Math.random()*.9,sx:(Math.random()-.5)*.35,rot:Math.random()*360,rs:(Math.random()-.5)*2.2,color:PC[Math.floor(Math.random()*PC.length)],op:.38+Math.random()*.42,w:Math.random()*Math.PI*2,ws:.4+Math.random()*.6,type:Math.floor(Math.random()*3)};}const bubbles=Array.from({length:14},()=>makeBubble());function makeBubble(){return{x:Math.random()*1800,y:H+Math.random()*200,r:6+Math.random()*22,sy:.15+Math.random()*.3,ph:Math.random()*Math.PI*2,color:BC[Math.floor(Math.random()*BC.length)]};}const butterflies=Array.from({length:5},()=>makeButterfly());function makeButterfly(){return{x:Math.random()*1800,y:80+Math.random()*(H*.5),vx:(Math.random()-.5)*.8,vy:(Math.random()-.5)*.4,ph:Math.random()*Math.PI*2,flapS:2+Math.random()*3,size:7+Math.random()*8,color:PC[Math.floor(Math.random()*PC.length)],op:.5+Math.random()*.4};}function drawPetal(p,t){ctx.save();ctx.translate(p.x+Math.sin(t*p.ws+p.w)*18,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.globalAlpha=p.op;ctx.fillStyle=p.color;if(p.type===0){ctx.beginPath();ctx.ellipse(0,0,p.r*.6,p.r*1.5,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=p.op*.25;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-p.r*.12,-p.r*.38,p.r*.2,p.r*.5,-.3,0,Math.PI*2);ctx.fill();}else if(p.type===1){ctx.beginPath();ctx.moveTo(0,-p.r*1.4);ctx.quadraticCurveTo(p.r*1.1,-p.r*.5,0,p.r*1.4);ctx.quadraticCurveTo(-p.r*1.1,-p.r*.5,0,-p.r*1.4);ctx.fill();}else{ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();}ctx.restore();}
function drawButterfly(b,t){const flap=Math.sin(t*b.flapS+b.ph);ctx.save();ctx.translate(b.x,b.y);ctx.globalAlpha=b.op;ctx.fillStyle=b.color;ctx.beginPath();ctx.ellipse(-b.size*flap*.9,0,b.size,b.size*.6,-.4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(b.size*flap*.9,0,b.size,b.size*.6,.4,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(156,31,99,0.6)';ctx.beginPath();ctx.ellipse(0,0,b.size*.15,b.size*.7,0,0,Math.PI*2);ctx.fill();ctx.restore();}
function drawBubble(b,t){ctx.save();ctx.globalAlpha=1;const g=ctx.createRadialGradient(b.x-b.r*.3,b.y-b.r*.3,0,b.x,b.y,b.r);g.addColorStop(0,'rgba(255,255,255,0.22)');g.addColorStop(.6,b.color);g.addColorStop(1,'rgba(255,179,209,0.04)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,179,209,0.18)';ctx.lineWidth=.8;ctx.stroke();ctx.restore();}
const blobs=Array.from({length:8},()=>({x:Math.random()*W,y:Math.random()*H,r:40+Math.random()*80,ph:Math.random()*Math.PI*2,sp:.15+Math.random()*.2}));let t=0;function frame(){ctx.clearRect(0,0,W,H);t+=.016;blobs.forEach(b=>{const px=b.x+Math.cos(t*b.sp+b.ph)*12;const py=b.y+Math.sin(t*b.sp*.7+b.ph)*18;ctx.save();const g=ctx.createRadialGradient(px,py,0,px,py,b.r);g.addColorStop(0,'rgba(255,179,209,0.07)');g.addColorStop(1,'rgba(255,240,245,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,b.r,0,Math.PI*2);ctx.fill();ctx.restore();});bubbles.forEach(b=>{b.y-=b.sy;b.x+=Math.sin(t*.4+b.ph)*.4;if(b.y<-b.r*2){Object.assign(b,makeBubble());b.y=H+b.r;}drawBubble(b,t);});petals.forEach(p=>{p.y+=p.sy;p.x+=Math.sin(t*p.ws+p.w)*.5+p.sx;p.rot+=p.rs;if(p.y>H+20){Object.assign(p,makePetal(true));p.x=Math.random()*W;}drawPetal(p,t);});butterflies.forEach(b=>{b.x+=b.vx+Math.sin(t*.3+b.ph)*.3;b.y+=b.vy+Math.cos(t*.25+b.ph)*.2;if(b.x<-60||b.x>W+60||b.y<-60||b.y>H+60){Object.assign(b,makeButterfly());b.x=Math.random()<.5?-20:W+20;b.y=80+Math.random()*(H*.5);}drawButterfly(b,t);});requestAnimationFrame(frame);}frame();})();
</script>
